<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cafeteria Artesanal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fundo marrom (cor primária do site) -->
  <rect width="64" height="64" rx="14" fill="#5a4a3a"/>

  <g transform="translate(2 1)">
    <!-- Vapor -->
    <g fill="none" stroke="#f5efe7" stroke-width="3" stroke-linecap="round">
      <path d="M22 21c-3.5-3.5 3.5-5.5 0-10"/>
      <path d="M31 21c-3.5-3.5 3.5-5.5 0-10"/>
    </g>

    <!-- Alça da xícara -->
    <path d="M43 31h3a5 5 0 0 1 0 10h-3" fill="none" stroke="#f5efe7" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Corpo da xícara -->
    <path d="M13 28h30v9a11 11 0 0 1-11 11h-8a11 11 0 0 1-11-11z" fill="#f5efe7"/>

    <!-- Pires -->
    <rect x="9" y="50" width="38" height="4" rx="2" fill="#f5efe7"/>

    <!-- Folha (cor secundária do site) -->
    <path d="M28 44c-7-2-8-9 0-13 8 4 7 11 0 13z" fill="#8b6f47"/>
    <path d="M28 44v-9" stroke="#f5efe7" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
